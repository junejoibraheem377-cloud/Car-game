<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Highway Rush 3D</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}canvas{display:block;width:100vw;height:100vh}</style></head>
<body><canvas id="c"></canvas><script>
const cv=document.getElementById("c"),g=cv.getContext("2d");let W,H,DPR=Math.min(devicePixelRatio||1,2);
const rs=()=>{W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR};rs();addEventListener("resize",rs);
const SEG=200,RW=2000,CAMH=900,DEPTH=1/Math.tan(50*Math.PI/180),DRAW=100,M=40,GOAL=1000,FIN=GOAL*M/SEG,N=FIN+70;
const GM=[0,48,85,122,162,205],NC=10;
const COL=["#d62839","#1d8cf8","#f1c40f","#2ecc71","#9b59b6","#e67e22","#ecf0f1","#16a085","#e84393","#34495e"];
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
let seed=7;const rn=()=>(seed=(seed*16807)%2147483647)/2147483647;
let LEVEL=1;try{LEVEL=+localStorage.getItem("hr3d")||1}catch(e){}
// ---- sound
let AC,osc;
function initA(){try{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();osc=AC.createOscillator();osc.type="sawtooth";const f=AC.createBiquadFilter();f.frequency.value=600;const e=AC.createGain();e.gain.value=.035;osc.connect(f);f.connect(e);e.connect(AC.destination);osc.start()}AC.resume()}catch(e){}}
function beep(f,d){try{if(!AC)return;const o=AC.createOscillator(),q=AC.createGain();o.type="square";o.frequency.value=f;q.gain.setValueAtTime(.08,AC.currentTime);q.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(q);q.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
// ---- track
const segs=[];
for(let i=0;i<N;i++){const f=i>FIN-12?0:1;segs.push({i,c:f*Math.sin(i/20)*2.6*Math.sin(i/70+.5),y:f*(Math.sin(i/24)*500+Math.sin(i/9)*120),sp:[]})}
segs.forEach(s=>{if(s.i%2==0){const sd=rn()<.5?-1:1,r=rn();
if(r<.45)s.sp.push({t:"tree",o:sd*(1.5+rn()*2.5),k:rn()});else if(r<.85)s.sp.push({t:"fl",o:sd*(1.25+rn()*.8),k:rn()});
if(s.i%9==0)s.sp.push({t:"house",o:-sd*(2.6+rn()),k:rn()});
if(s.i%14==0)s.sp.push({t:"hill",o:sd*(6+rn()*4),k:rn()})}});
// ---- state
let st,pos,px,v,gear,rpm,steer,state,cars,order,bc,shake,t0,bg,hint,tilt=0,tiltOn=false;
function reset(){pos=0;px=0;v=0;gear=1;rpm=.2;steer=0;state="count";order=[];bc=0;shake=0;bg=0;hint=6;t0=performance.now();
const base=Math.min(118+LEVEL*8,185),L=[-.65,-.22,.22,.65];
cars=[];for(let i=0;i<NC-1;i++)cars.push({z:(6+i*7)*M,x:L[i%4],tx:L[i%4],v:0,tv:base/3.6,base:base+(rn()*24-12),nt:0,fin:false,c:COL[i+1],id:i+1});}
reset();
// ---- input
const keys={},ptr={};
addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=1});addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=0});
addEventListener("deviceorientation",e=>{if(e.gamma!=null){tiltOn=true;tilt=Math.abs(e.gamma)<2?0:cl(e.gamma/25,-1,1)}});
function pedals(){return[{n:"clu",x:W*.52,w:W*.13,h:H*.10},{n:"brk",x:W*.67,w:W*.15,h:H*.11},{n:"gas",x:W*.85,w:W*.11,h:H*.14}]}
cv.addEventListener("pointerdown",e=>{ptr[e.pointerId]=[e.clientX,e.clientY];initA();
try{if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission)DeviceOrientationEvent.requestPermission()}catch(x){}
if(state=="done"&&e.clientX>W*.2&&e.clientX<W*.8&&Math.abs(e.clientY-H*.55)<H*.05)reset()});
cv.addEventListener("pointermove",e=>{if(ptr[e.pointerId])ptr[e.pointerId]=[e.clientX,e.clientY]});
["pointerup","pointercancel"].forEach(n=>cv.addEventListener(n,e=>{delete ptr[e.pointerId]}));
// ---- drawing helpers
function quad(x1,y1,w1,x2,y2,w2,c){g.fillStyle=c;g.beginPath();g.moveTo(x1-w1,y1);g.lineTo(x1+w1,y1);g.lineTo(x2+w2,y2);g.lineTo(x2-w2,y2);g.fill()}
function rr(x,y,w,h,r,c){g.fillStyle=c;g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h);g.fill()}
function circ(x,y,r,c){g.fillStyle=c;g.beginPath();g.arc(x,y,Math.max(r,.3),0,7);g.fill()}
function rearCar(x,y,w,c){const h=w*.62;
g.fillStyle="rgba(0,0,0,.35)";g.fillRect(x-w*.55,y-h*.06,w*1.1,h*.12);
g.fillStyle="#111";g.fillRect(x-w*.5,y-h*.32,w*.15,h*.32);g.fillRect(x+w*.35,y-h*.32,w*.15,h*.32);
rr(x-w*.5,y-h*.72,w,h*.5,w*.06,c);rr(x-w*.37,y-h*1.02,w*.74,h*.36,w*.08,c);
g.fillStyle="rgba(0,0,0,.25)";g.fillRect(x-w*.37,y-h*1.02,w*.74,h*.36);
g.fillStyle="#9fd4f5";g.fillRect(x-w*.3,y-h*.97,w*.6,h*.22);
g.fillStyle="#ff2a2a";g.fillRect(x-w*.46,y-h*.64,w*.2,h*.1);g.fillRect(x+w*.26,y-h*.64,w*.2,h*.1);
g.fillStyle="#eee";g.fillRect(x-w*.1,y-h*.4,w*.2,h*.08)}
function sprite(s,x,y,u){const k=s.k;
if(s.t=="tree"){g.fillStyle="#5b3a1e";g.fillRect(x-u*.02,y-u*.2,u*.04,u*.2);circ(x,y-u*.38,u*.2,"#1e6b2a");circ(x-u*.04,y-u*.43,u*.14,"#2a8a38");circ(x-u*.07,y-u*.46,u*.07,"#3fae4d")}
else if(s.t=="fl"){g.fillStyle="#2f7d32";g.beginPath();g.ellipse(x,y,u*.09,u*.03,0,0,7);g.fill();
const fc=["#ff4d6d","#ffd166","#ffffff","#ff9f1c","#c77dff"];for(let a=0;a<7;a++)circ(x+(Math.sin(a*2.4+k*9))*u*.08,y-u*.03-((a*37+k*50)%10)/10*u*.05,u*.014,fc[(a+Math.floor(k*5))%5])}
else if(s.t=="house"){g.fillStyle="#f0e0c0";g.fillRect(x-u*.3,y-u*.3,u*.6,u*.3);g.fillStyle="#b03a2e";g.beginPath();g.moveTo(x-u*.36,y-u*.3);g.lineTo(x,y-u*.55);g.lineTo(x+u*.36,y-u*.3);g.fill();
g.fillStyle="#6b4a2a";g.fillRect(x-u*.05,y-u*.16,u*.1,u*.16);g.fillStyle="#8fc7ee";g.fillRect(x-u*.22,y-u*.24,u*.1,u*.1);g.fillRect(x+u*.12,y-u*.24,u*.1,u*.1)}
else{g.fillStyle="#2f7a35";g.beginPath();g.ellipse(x,y,u*1.6,u*1.1,0,Math.PI,2*Math.PI);g.fill();g.fillStyle="#3fa346";g.beginPath();g.ellipse(x-u*.2,y,u*1.1,u*.8,0,Math.PI,2*Math.PI);g.fill()}}
function mount(col,off,amp,y0,fr){g.fillStyle=col;g.beginPath();g.moveTo(0,y0);for(let x=0;x<=W;x+=8)g.lineTo(x,y0-amp*(.5+.5*Math.sin((x+off)*fr)+.3*Math.sin((x+off)*fr*2.3)));g.lineTo(W,y0);g.fill()}
// ---- world
function world(){
const hz=H*.36,base=Math.floor(pos/SEG),bp=(pos%SEG)/SEG,sa=segs[base],sb=segs[Math.min(base+1,N-1)];
const camY=CAMH+sa.y+(sb.y-sa.y)*bp,camX=px*RW,camZ=pos-CAMH*DEPTH;
let gr=g.createLinearGradient(0,0,0,hz);gr.addColorStop(0,"#3d8fe0");gr.addColorStop(1,"#d4ecfb");g.fillStyle=gr;g.fillRect(0,0,W,hz+2);
circ(W*.78-bg*.1%W,hz*.35,18,"rgba(255,244,200,.95)");
g.fillStyle="rgba(255,255,255,.85)";[[.2,.2],[.55,.12],[.85,.28]].forEach(c=>{const cx=((c[0]*W+bg*.2)%(W+120)+W+120)%(W+120)-60;g.beginPath();g.ellipse(cx,hz*c[1]+10,46,12,0,0,7);g.ellipse(cx+22,hz*c[1],30,12,0,0,7);g.fill()});
mount("#7a9bbf",bg*.3,hz*.5,hz,.012);mount("#3f8a46",bg*.7,hz*.3,hz+4,.02);
g.fillStyle="#3e9a3c";g.fillRect(0,hz,W,H-hz);
let x=0,dx=-bp*sa.c,clip=H;const bk={};
cars.forEach(c=>{const i=Math.floor(c.z/SEG);if(i>=base&&i<=base+DRAW)(bk[i]=bk[i]||[]).push(c)});
let mx=0;
for(let n=0;n<DRAW;n++){const s=segs[base+n];if(!s)break;const cz=s.i*SEG-camZ;if(cz<=1)continue;
s.sc=DEPTH/cz;s.sx=W/2+s.sc*(x-camX)*W/2;s.sy=hz-s.sc*(s.y-camY)*H/2;s.sw=s.sc*RW*W/2;
s.hid=n>0&&s.sy>=clip;if(s.sy<clip)clip=s.sy;x+=dx;dx+=s.c;mx=n}
for(let n=mx;n>=1;n--){const a=segs[base+n-1],b=segs[base+n];if(b.hid||!a.sc)continue;
const l=b.i%6<3,e=b.i%4<2;
g.fillStyle=l?"#3e9a3c":"#378f35";g.fillRect(0,b.sy,W,a.sy-b.sy);
quad(a.sx,a.sy,a.sw*1.22,b.sx,b.sy,b.sw*1.22,"#b9bdc2");
quad(a.sx,a.sy,a.sw*1.12,b.sx,b.sy,b.sw*1.12,e?"#d62828":"#f2f2f2");
quad(a.sx,a.sy,a.sw,b.sx,b.sy,b.sw,l?"#3d3d40":"#424246");
if(e)[-.5,0,.5].forEach(o=>quad(a.sx+a.sw*o,a.sy,a.sw*.015,b.sx+b.sw*o,b.sy,b.sw*.015,o==0?"#f1c40f":"#fff"));
if(b.i==FIN||b.i==FIN+1)for(let k=0;k<10;k++){const lf=-1+k*.2,rt=lf+.2;g.fillStyle=(k+b.i)%2?"#fff":"#111";
g.beginPath();g.moveTo(a.sx+a.sw*lf,a.sy);g.lineTo(a.sx+a.sw*rt,a.sy);g.lineTo(b.sx+b.sw*rt,b.sy);g.lineTo(b.sx+b.sw*lf,b.sy);g.fill()}
b.sp.forEach(s=>sprite(s,b.sx+s.o*b.sw,b.sy,b.sw));
(bk[b.i]||[]).forEach(c=>rearCar(b.sx+c.x*b.sw,b.sy,b.sw*.3,c.c));
if(b.i==FIN){const u=b.sw,y=b.sy;g.fillStyle="#6b7078";g.fillRect(b.sx-u*1.2,y-u*.9,u*.06,u*.9);g.fillRect(b.sx+u*1.14,y-u*.9,u*.06,u*.9);
g.fillStyle="#1b1e24";g.fillRect(b.sx-u*1.2,y-u*.95,u*2.4,u*.25);
for(let k=0;k<24;k++){g.fillStyle=k%2?"#fff":"#111";g.fillRect(b.sx-u*1.2+k*u*.1,y-u*.95,u*.1,u*.05)}
g.fillStyle="#fff";g.font="bold "+Math.max(6,u*.14)+"px Arial";g.textAlign="center";g.fillText("FINISH",b.sx,y-u*.77)}}
(bk[base]||[]).forEach(c=>{const b=segs[base];if(b.sw)rearCar(b.sx+c.x*b.sw,b.sy+H*.05,b.sw*.3,c.c)});
return sa.c}
// ---- cockpit
function gauge(cx,cy,r,val,max,red,txt){circ(cx,cy,r*1.08,"#050607");circ(cx,cy,r,"#14171c");
for(let i=0;i<=10;i++){const a=(-135+i*27)*Math.PI/180,s=Math.sin(a),c=Math.cos(a);g.strokeStyle=i>=red?"#ff3b30":"#fff";g.lineWidth=i%2?1:2;g.beginPath();g.moveTo(cx+s*r*.78,cy-c*r*.78);g.lineTo(cx+s*r*.94,cy-c*r*.94);g.stroke()}
const a=(-135+cl(val/max,0,1)*270)*Math.PI/180;g.strokeStyle="#ff3b30";g.lineWidth=2.5;g.beginPath();g.moveTo(cx,cy);g.lineTo(cx+Math.sin(a)*r*.82,cy-Math.cos(a)*r*.82);g.stroke();
circ(cx,cy,r*.1,"#333");g.fillStyle="#cfd3d7";g.font="bold "+r*.2+"px Arial";g.textAlign="center";g.fillText(txt,cx,cy+r*.55)}
function cockpit(sp,gas,brk,clu,disp){
const dt=H*.66;
g.fillStyle="#0a0b0d";g.fillRect(0,0,W,H*.04);
g.beginPath();g.moveTo(0,0);g.lineTo(W*.1,0);g.lineTo(0,H*.6);g.fill();g.beginPath();g.moveTo(W,0);g.lineTo(W*.9,0);g.lineTo(W,H*.6);g.fill();
rr(W*.33,H*.012,W*.34,H*.05,8,"#14161a");let m=g.createLinearGradient(0,0,0,H*.06);m.addColorStop(0,"#9ccbee");m.addColorStop(1,"#5f9a55");g.fillStyle=m;g.fillRect(W*.345,H*.02,W*.31,H*.034);
let d=g.createLinearGradient(0,dt,0,H);d.addColorStop(0,"#23262c");d.addColorStop(1,"#0b0c0e");g.fillStyle=d;
g.beginPath();g.moveTo(0,dt+H*.025);g.quadraticCurveTo(W/2,dt-H*.03,W,dt+H*.025);g.lineTo(W,H);g.lineTo(0,H);g.fill();
g.fillStyle="#3a3e46";g.fillRect(0,dt+H*.02,W,2);
gauge(W*.26,H*.745,W*.115,v*3.6,240,8,Math.round(v*3.6)+" km/h");
gauge(W*.74,H*.745,W*.115,disp*7,8,6.5,"x1000");
g.fillStyle="#ffd166";g.font="bold "+W*.075+"px Arial";g.textAlign="center";g.fillText(v<.5&&!clu?"N":gear,W/2,H*.76);
g.fillStyle="#9aa0a6";g.font=W*.03+"px Arial";g.fillText("GEAR",W/2,H*.785);
if(state=="run"&&!clu&&rpm>.93&&gear<5&&Math.floor(performance.now()/200)%2){g.fillStyle="#ff3b30";g.font="bold "+W*.05+"px Arial";g.fillText("SHIFT! CLUTCH",W/2,H*.7)}
// wheel
const wx=W*.30,wy=H*.985,wr=W*.27;g.save();g.translate(wx,wy);g.rotate(steer*1.2);
g.lineWidth=wr*.14;g.strokeStyle="#15171b";g.beginPath();g.arc(0,0,wr,0,7);g.stroke();
g.lineWidth=wr*.04;g.strokeStyle="#2c3036";g.beginPath();g.arc(0,0,wr*1.06,Math.PI*1.05,Math.PI*1.95);g.stroke();
g.lineWidth=wr*.07;g.strokeStyle="#22252a";[[-1,.25],[1,.25],[0,-1]].forEach(p=>{g.beginPath();g.moveTo(0,0);g.lineTo(p[0]*wr*.95,p[1]*wr*.4);g.stroke()});
circ(0,0,wr*.2,"#26292f");circ(0,0,wr*.07,"#d62839");g.fillStyle="#ffd166";g.fillRect(-wr*.025,-wr-wr*.07,wr*.05,wr*.14);
[-1,1].forEach(sd=>{const an=-Math.PI/2+sd*.62,hx=Math.cos(an)*wr,hy=Math.sin(an)*wr;
g.lineCap="round";g.lineWidth=wr*.2;g.strokeStyle="#2c3e50";g.beginPath();g.moveTo(hx*1.15,hy+wr*.9);g.lineTo(hx,hy+wr*.1);g.stroke();
circ(hx,hy,wr*.12,"#d9a066");g.strokeStyle="#b9824c";g.lineWidth=1.5;g.beginPath();g.arc(hx,hy,wr*.12,Math.PI,2*Math.PI);g.stroke();
g.lineWidth=wr*.05;g.strokeStyle="#d9a066";g.beginPath();g.moveTo(hx-wr*.1,hy);g.lineTo(hx+wr*.1,hy);g.stroke()});
g.restore();
// pedals
pedals().forEach(p=>{const on=p.n=="gas"?gas:p.n=="brk"?brk:clu,y=H-p.h-8+(on?H*.015:0);
g.fillStyle="#6c727a";g.fillRect(p.x+p.w*.4,y-H*.03,p.w*.2,H*.04);
rr(p.x-p.w/2,y,p.w,p.h,10,on?"#33363b":"#1d1f23");g.strokeStyle="#9aa0a6";g.lineWidth=2;g.strokeRect(p.x-p.w/2+2,y+2,p.w-4,p.h-4);
g.fillStyle="#08090a";for(let k=p.h*.25;k<p.h-8;k+=p.h*.16)g.fillRect(p.x-p.w*.38,y+k,p.w*.76,3);
g.fillStyle="#cfd3d7";g.font="bold "+W*.028+"px Arial";g.textAlign="center";g.fillText(p.n=="clu"?"CLUTCH":p.n=="brk"?"BRAKE":"GAS",p.x,y-H*.012+(p.n=="gas"?-H*.03:0))})}
// ---- loop
let last=performance.now();
function frame(now){const dt=Math.min(now-last,50)/1000;last=now;
let gas=0,brk=0,clu=0,drag=0;
for(const k in ptr){const[x,y]=ptr[k];let hit=0;pedals().forEach(p=>{if(Math.abs(x-p.x)<p.w*.65&&y>H-p.h-H*.06){hit=1;if(p.n=="gas")gas=1;if(p.n=="brk")brk=1;if(p.n=="clu")clu=1}});
if(!hit&&y>H*.6&&x<W*.5)drag=cl((x-W*.30)/(W*.18),-1,1)}
const ks=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0);
if(keys.arrowup||keys.w)gas=1;if(keys.arrowdown||keys.s)brk=1;if(keys.shift||keys.c||keys[" "])clu=1;
let tgt=ks||drag||(tiltOn?tilt:0);
if(state=="count"){gas=brk=clu=0;tgt=0;if(now-t0>3200){state="run";beep(880,.3)}}
if(state=="done"){gas=0;clu=0;brk=1;tgt=0}
steer+=(tgt-steer)*Math.min(1,10*dt);
const kmh=v*3.6;
if(clu){const gi=GM.findIndex((m,i)=>i>0&&kmh<=m*.85);gear=gi<0?5:gi}
rpm=cl(kmh/GM[gear],0,1.1);
let a=0;if(gas&&!clu){a=22*Math.max(0,1-Math.pow(rpm,4));if(rpm<.25)a*=.6}
v+=a*dt;if(brk)v-=38*dt;v-=(clu?1.2:2.2+.0012*v*v)*dt*(gas&&!clu?.4:1);
if(Math.abs(px)>1.05){v-=20*dt;shake=.6}
v=cl(v,0,GM[5]/3.6);
const sp=v/(GM[5]/3.6),cur=segs[Math.min(Math.floor(pos/SEG),N-1)].c;
px+=steer*dt*2.4*Math.max(.15,sp+.25);px-=dt*cur*sp*.85*1.2;px=cl(px,-1.6,1.6);
pos+=v*M*dt;bg-=cur*v*dt*.6;bc-=dt;shake=Math.max(0,shake-dt*2);
// AI
cars.forEach(c=>{c.nt-=dt;if(c.nt<=0){c.nt=2+rn()*3;c.tv=(c.base+(rn()*10-5))/3.6;if(rn()<.6){const L=[-.65,-.22,.22,.65].filter(o=>!cars.some(q=>q!==c&&Math.abs(q.z-c.z)<14*M&&Math.abs(q.x-o)<.2));if(L.length)c.tx=L[Math.floor(rn()*L.length)]}}
const gap=(c.z-pos)/M;let tv=c.tv+(gap>300?-35/3.6:gap<-100?55/3.6:0);if(c.fin)tv=20;if(state=="count")tv=0;
c.v+=(tv-c.v)*Math.min(1,1.3*dt);c.z+=c.v*M*dt;c.x+=(c.tx-c.x)*Math.min(1,2.5*dt);
if(!c.fin&&c.z>=GOAL*M){c.fin=true;order.push(c.id)}
if(state=="run"&&bc<=0&&Math.abs(gap)<3.2&&Math.abs(c.x-px)<.3){bc=.6;v*=.5;c.v*=.93;px=cl(px+(px<c.x?-.18:.18),-1.6,1.6);shake=1;beep(120,.15)}});
if(state=="run"&&pos>=GOAL*M){state="done";const rank=order.length+1;st={rank,win:rank==1};if(st.win){LEVEL++;try{localStorage.setItem("hr3d",LEVEL)}catch(e){}}beep(st.win?880:200,.4)}
// draw
g.setTransform(DPR,0,0,DPR,0,0);g.clearRect(0,0,W,H);
g.save();if(shake>0)g.translate((Math.random()-.5)*shake*8,(Math.random()-.5)*shake*8);
world();
g.restore();
frame.d=(frame.d||0)+(((gas||clu&&gas)?(clu?.9:Math.max(.15,rpm)):Math.max(.12,rpm*(clu?.3:1)))-(frame.d||0))*Math.min(1,6*dt);
if(osc)osc.frequency.value=45+frame.d*170;
cockpit(sp,gas,brk,clu,frame.d);
// HUD
const rank=1+cars.filter(c=>c.z>pos).length;
g.fillStyle="rgba(0,0,0,.5)";g.fillRect(0,H*.04,W,H*.045);g.font="bold "+W*.04+"px Arial";
g.fillStyle="#ffd166";g.textAlign="left";g.fillText("LEVEL "+LEVEL,10,H*.072);
g.fillStyle=rank==1?"#2ecc71":"#fff";g.textAlign="center";g.fillText("POS "+rank+"/"+NC,W/2,H*.072);
g.fillStyle="#fff";g.textAlign="right";g.fillText(Math.min(Math.floor(pos/M),GOAL)+" / "+GOAL+" m",W-10,H*.072);
